[package]
name = "tasky"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A lightweight Windows task manager: live processes, CPU/GPU/RAM/disk usage, kill and suspend."
build = "build.rs"
publish = false

[dependencies]
raw-window-handle = "0.6"
egui = "0.32.3"
egui_extras = "0.32.3"
# Only what a Windows build uses: no Wayland/X11 backends.
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.4.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# A panic anywhere leaves Tasky half-working (say, a dead sampler thread). The
# panic hook resumes suspended processes, then the process exits, and the
# logon task's restart-on-failure brings it back.
panic = "abort"

[profile.dev]
opt-level = 1
